<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Checklist</title>
    <!--
      Appearance (US-08a): applies this device's Dark / Light / System choice before the page first draws, so there's
      no flash of the wrong theme. Dark when nothing is stored. Mirrors src/client/lib/theme.ts (keys "appearance" and
      "glass").
    -->
    <script>
      (function () {
        var pref = "dark";
        try {
          pref = localStorage.getItem("appearance") || "dark";
        } catch (e) {}
        var light =
          pref === "light" || (pref === "system" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#ffffff" : "#0a0a0a");
        // Glass effects (requirements C40): solid surfaces when this device turned them off (key "glass").
        try {
          if (localStorage.getItem("glass") === "off") document.documentElement.setAttribute("data-glass", "off");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
